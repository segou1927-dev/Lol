<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Dodger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        #gameWrapper {
            position: relative;
            width: 360px;
            height: 640px;
        }
        
        /* МЕНЮ */
        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a3e, #0f0f2e);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        #menuScreen h1 {
            color: white;
            font-size: 30px;
            margin-bottom: 5px;
            text-align: center;
        }
        
        #menuScreen p {
            color: #8888cc;
            font-size: 14px;
            margin-bottom: 35px;
            text-align: center;
        }
        
        .menu-btn {
            width: 270px;
            padding: 18px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: block;
            text-align: center;
            -webkit-appearance: none;
        }
        
        .menu-btn:active {
            opacity: 0.7;
        }
        
        #btnEasy { background: #22c55e; }
        #btnMedium { background: #f59e0b; color: #1a1a2e; }
        #btnHard { background: #dc2626; }
        #btnExtreme { background: #7c3aed; }
        
        .menu-btn .small {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.9;
            display: block;
            margin-top: 3px;
        }
        
        /* ИГРОВОЕ ПОЛЕ */
        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a1a, #1a1a3e, #0a0a1a);
            border-radius: 20px;
            overflow: hidden;
            display: none;
            z-index: 5;
            border: 2px solid rgba(255,255,255,0.15);
        }
        
        #player {
            position: absolute;
            bottom: 40px;
            left: 155px;
            width: 50px;
            height: 50px;
            background: #e94560;
            border-radius: 12px;
            z-index: 10;
            pointer-events: none;
        }
        
        .block {
            position: absolute;
            width: 45px;
            height: 45px;
            background: #533483;
            border-radius: 10px;
            pointer-events: none;
        }
        
        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 15;
            background: rgba(0,0,0,0.7);
            padding: 10px 25px;
            border-radius: 25px;
            pointer-events: none;
        }
        
        /* ЭКРАН КОНЦА */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: 20px;
        }
        
        #gameOverScreen h2 {
            color: #ff6b6b;
            font-size: 34px;
            margin-bottom: 5px;
        }
        
        #gameOverScreen .score {
            color: white;
            font-size: 50px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        #gameOverScreen button {
            padding: 15px 40px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            -webkit-appearance: none;
        }
        
        #gameOverScreen button:active {
            opacity: 0.7;
        }
        
        #btnRestart { background: #e94560; }
        #btnMenu { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="gameWrapper">
        
        <!-- МЕНЮ -->
        <div id="menuScreen">
            <h1>⚡ BLOCK DODGER</h1>
            <p>Уклоняйся от падающих блоков!</p>
            
            <button class="menu-btn" id="btnEasy">
                🟢 ЛЁГКИЙ
                <span class="small">Медленно • Для новичков</span>
            </button>
            
            <button class="menu-btn" id="btnMedium">
                🟡 СРЕДНИЙ
                <span class="small">Умеренно • Есть опыт</span>
            </button>
            
            <button class="menu-btn" id="btnHard">
                🔴 СЛОЖНЫЙ
                <span class="small">Быстро • Хардкор</span>
            </button>
            
            <button class="menu-btn" id="btnExtreme">
                🟣 ЭКСТРИМ
                <span class="small">Максимум • Для богов</span>
            </button>
        </div>
        
        <!-- ИГРА -->
        <div id="gameContainer">
            <div id="scoreDisplay">Счёт: 0</div>
            <div id="player"></div>
        </div>
        
        <!-- GAME OVER -->
        <div id="gameOverScreen">
            <h2>💀 КОНЕЦ ИГРЫ</h2>
            <div class="score" id="finalScore">0</div>
            <p style="color:#ccc;margin-bottom:20px;" id="finalDiff"></p>
            <button id="btnRestart">🔄 ИГРАТЬ СНОВА</button>
            <button id="btnMenu">🏠 В МЕНЮ</button>
        </div>
        
    </div>

    <script>
        // ЭЛЕМЕНТЫ
        var menuScreen = document.getElementById('menuScreen');
        var gameContainer = document.getElementById('gameContainer');
        var gameOverScreen = document.getElementById('gameOverScreen');
        var player = document.getElementById('player');
        var scoreDisplay = document.getElementById('scoreDisplay');
        var finalScore = document.getElementById('finalScore');
        var finalDiff = document.getElementById('finalDiff');
        
        // ПЕРЕМЕННЫЕ
        var playerX = 155;
        var score = 0;
        var gameRunning = false;
        var blocks = [];
        var blockSpeed = 3;
        var spawnInterval = 1400;
        var maxBlocks = 5;
        var gameLoopId = null;
        var spawnLoopId = null;
        var currentDifficulty = 'medium';
        
        // НАСТРОЙКИ
        var settings = {
            easy:   { speed: 2, spawn: 1800, max: 4, name: 'ЛЁГКИЙ' },
            medium: { speed: 3, spawn: 1400, max: 5, name: 'СРЕДНИЙ' },
            hard:   { speed: 4.5, spawn: 900, max: 7, name: 'СЛОЖНЫЙ' },
            extreme:{ speed: 6, spawn: 600, max: 10, name: 'ЭКСТРИМ' }
        };
        
        // ЗАПУСК ИГРЫ
        function startGame(difficulty) {
            // Настройки
            var s = settings[difficulty];
            currentDifficulty = difficulty;
            blockSpeed = s.speed;
            spawnInterval = s.spawn;
            maxBlocks = s.max;
            score = 0;
            blocks = [];
            
            // Очистка
            var oldBlocks = gameContainer.querySelectorAll('.block');
            for (var i = 0; i < oldBlocks.length; i++) {
                oldBlocks[i].remove();
            }
            
            // Позиция игрока
            playerX = 155;
            player.style.left = '155px';
            player.style.background = '#e94560';
            
            // Отображение
            menuScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            gameOverScreen.style.display = 'none';
            scoreDisplay.textContent = 'Счёт: 0';
            
            gameRunning = true;
            
            // Циклы
            if (gameLoopId) clearInterval(gameLoopId);
            if (spawnLoopId) clearInterval(spawnLoopId);
            
            gameLoopId = setInterval(moveBlocks, 20);
            spawnLoopId = setInterval(createBlock, spawnInterval);
        }
        
        // СОЗДАНИЕ БЛОКА
        function createBlock() {
            if (!gameRunning) return;
            if (blocks.length >= maxBlocks) return;
            
            var block = document.createElement('div');
            block.className = 'block';
            block.style.left = (Math.random() * 305 + 5) + 'px';
            block.style.top = '-50px';
            
            gameContainer.appendChild(block);
            blocks.push(block);
        }
        
        // ДВИЖЕНИЕ БЛОКОВ
        function moveBlocks() {
            if (!gameRunning) return;
            
            for (var i = blocks.length - 1; i >= 0; i--) {
                var block = blocks[i];
                var top = parseFloat(block.style.top) || -50;
                top += blockSpeed;
                block.style.top = top + 'px';
                
                // Столкновение
                if (top > 540) {
                    var br = block.getBoundingClientRect();
                    var pr = player.getBoundingClientRect();
                    
                    if (!(br.right-8 < pr.left+8 || br.left+8 > pr.right-8 || 
                          br.bottom-8 < pr.top+8 || br.top+8 > pr.bottom-8)) {
                        endGame();
                        return;
                    }
                }
                
                // Удаление
                if (top > 640) {
                    block.remove();
                    blocks.splice(i, 1);
                    if (gameRunning) {
                        score++;
                        scoreDisplay.textContent = 'Счёт: ' + score;
                    }
                }
            }
        }
        
        // УПРАВЛЕНИЕ МЫШЬЮ
        gameContainer.addEventListener('mousemove', function(e) {
            if (!gameRunning) return;
            var rect = gameContainer.getBoundingClientRect();
            playerX = e.clientX - rect.left - 25;
            if (playerX < 5) playerX = 5;
            if (playerX > 305) playerX = 305;
            player.style.left = playerX + 'px';
        });
        
        // УПРАВЛЕНИЕ ПАЛЬЦЕМ
        gameContainer.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (!gameRunning) return;
            var rect = gameContainer.getBoundingClientRect();
            playerX = e.touches[0].clientX - rect.left - 25;
            if (playerX < 5) playerX = 5;
            if (playerX > 305) playerX = 305;
            player.style.left = playerX + 'px';
        });
        
        gameContainer.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (!gameRunning) return;
            var rect = gameContainer.getBoundingClientRect();
            playerX = e.touches[0].clientX - rect.left - 25;
            if (playerX < 5) playerX = 5;
            if (playerX > 305) playerX = 305;
            player.style.left = playerX + 'px';
        });
        
        // КОНЕЦ ИГРЫ
        function endGame() {
            gameRunning = false;
            if (gameLoopId) clearInterval(gameLoopId);
            if (spawnLoopId) clearInterval(spawnLoopId);
            
            gameOverScreen.style.display = 'flex';
            finalScore.textContent = score;
            finalDiff.textContent = 'Сложность: ' + settings[currentDifficulty].name;
        }
        
        // ПЕРЕЗАПУСК
        function restartGame() {
            gameOverScreen.style.display = 'none';
            var oldBlocks = gameContainer.querySelectorAll('.block');
            for (var i = 0; i < oldBlocks.length; i++) {
                oldBlocks[i].remove();
            }
            startGame(currentDifficulty);
        }
        
        // В МЕНЮ
        function goToMenu() {
            gameRunning = false;
            if (gameLoopId) clearInterval(gameLoopId);
            if (spawnLoopId) clearInterval(spawnLoopId);
            
            gameOverScreen.style.display = 'none';
            gameContainer.style.display = 'none';
            menuScreen.style.display = 'flex';
            
            var oldBlocks = gameContainer.querySelectorAll('.block');
            for (var i = 0; i < oldBlocks.length; i++) {
                oldBlocks[i].remove();
            }
        }
        
        // НАЗНАЧЕНИЕ КНОПОК (через addEventListener — надёжнее чем onclick)
        document.getElementById('btnEasy').addEventListener('click', function() { startGame('easy'); });
        document.getElementById('btnMedium').addEventListener('click', function() { startGame('medium'); });
        document.getElementById('btnHard').addEventListener('click', function() { startGame('hard'); });
        document.getElementById('btnExtreme').addEventListener('click', function() { startGame('extreme'); });
        document.getElementById('btnRestart').addEventListener('click', restartGame);
        document.getElementById('btnMenu').addEventListener('click', goToMenu);
        
        // Добавляем также onclick для совместимости
        document.getElementById('btnEasy').setAttribute('onclick', "startGame('easy')");
        document.getElementById('btnMedium').setAttribute('onclick', "startGame('medium')");
        document.getElementById('btnHard').setAttribute('onclick', "startGame('hard')");
        document.getElementById('btnExtreme').setAttribute('onclick', "startGame('extreme')");
        document.getElementById('btnRestart').setAttribute('onclick', 'restartGame()');
        document.getElementById('btnMenu').setAttribute('onclick', 'goToMenu()');
    </script>
</body>
  </html>
